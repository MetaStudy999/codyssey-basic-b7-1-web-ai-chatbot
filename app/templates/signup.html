{% extends "base.html" %}
{% block title %}회원가입 · Codyssey AI Chatbot{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>회원가입</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/signup" class="stack">
    <label>아이디<input name="username" minlength="3" autocomplete="username" required></label>
    <label>비밀번호<input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
    <button type="submit">계정 만들기</button>
  </form>
</section>
{% endblock %}
