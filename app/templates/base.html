<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Codyssey AI Chatbot{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="/">Codyssey B7-1</a>
  <nav>
    <a href="/">홈</a>
    {% if user %}
      <a href="/chat">챗봇</a>
      <a href="/logs">내 로그</a>
      <form action="/logout" method="post" class="inline"><button type="submit">로그아웃</button></form>
    {% else %}
      <a href="/login">로그인</a>
      <a href="/signup">회원가입</a>
    {% endif %}
  </nav>
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
</body>
</html>
